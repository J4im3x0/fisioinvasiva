services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fisio:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@db:5432/fisio
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fisio
      POSTGRES_USER: fisio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisio -d fisio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  media:
