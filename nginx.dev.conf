# Archivo para /etc/nginx/sites-available/fisioinvasiva-dev (incluido dentro de http {}).
map $http_upgrade $fisio_dev_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name dev.fisioinvasiva.cl;
    return 301 https://dev.fisioinvasiva.cl$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.fisioinvasiva.cl;

    ssl_certificate         /etc/ssl/public/public-fisioinvasiva.cl.pem;
    ssl_certificate_key     /etc/ssl/private/private-fisioinvasiva.cl.pem;
    ssl_client_certificate /etc/ssl/cloudflare.crt;
    ssl_verify_client on;

    auth_basic "Fisio Invasiva dev";
    auth_basic_user_file /etc/nginx/.htpasswd-fisio-dev;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fisio_dev_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
